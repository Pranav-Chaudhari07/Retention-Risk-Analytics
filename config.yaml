pipeline:
  dataset_path: "data/telco_churn.csv"
  output_dir: "results/"
  log_file: "results/pipeline.log"
  random_seed: 42
  stages:
    - data_ingestion
    - preprocessing
    - eda
    - model_training
    - prediction
    - risk_classification
    - shap_explanation
    - recommendation
    - dashboard

preprocessor:
  artifact_path: "artifacts/preprocessor.pkl"

classifier:
  test_split_ratio: 0.20
  artifact_path: "artifacts/best_model.pkl"
  output_dir: "results/plots/"

shap:
  top_n: 5
  output_dir: "results/shap/"

risk:
  low_max_threshold: 0.40
  medium_max_threshold: 0.70

dashboard:
  results_path: "results/predictions.csv"
  port: 8501
